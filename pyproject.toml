[project]
name = "jsonweir"
version = "0.1.0"
description = "A small, resumable JSON decoder that catches complete JSON values from a stream."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "nueruyu" }]
keywords = ["json", "streaming", "parser", "incremental"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nueruyu/jsonweir"
Repository = "https://github.com/nueruyu/jsonweir"
Issues = "https://github.com/nueruyu/jsonweir/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jsonweir"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0"]
